name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/bootstrap-wsl-lab.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Run non-strict capability report
        run: bash scripts/verify-host.sh

      - name: Exercise baseline capture
        run: |
          bash scripts/capture-baseline.sh --output artifacts/ci-baseline
          sha256sum --check artifacts/ci-baseline/manifest.sha256

      - name: Install Ansible validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --disable-pip-version-check -r requirements-dev.txt
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy collection install -r requirements.yml"

      - name: Lint Ansible content
        run: "$RUNNER_TEMP/ansible-venv/bin/ansible-lint"

      - name: Check playbook syntax
        run: |
          ANSIBLE_ROLES_PATH=roles "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            --syntax-check -i inventory/example/hosts.yml playbooks/site.yml
          ANSIBLE_ROLES_PATH=roles "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            --syntax-check -i inventory/example/hosts.yml playbooks/verify.yml

      - name: Reject unsafe Ansible input
        run: bash scripts/test-invalid-ansible-input.sh
