name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Validate shell syntax
        run: bash -n scripts/*.sh

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts/*.ps1) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors) {
              $errors | ForEach-Object { Write-Error $_ }
              exit 1
            }
          }

      - name: Reject unsafe bootstrap parameters
        shell: pwsh
        run: ./scripts/test-bootstrap-input.ps1

      - name: Run non-strict capability report
        run: bash scripts/verify-host.sh

      - name: Test Python health check
        run: bash scripts/test-health-check.sh

      - name: Exercise Linux operations lab
        run: bash scripts/test-linux-operations-lab.sh

      - name: Exercise baseline capture
        run: |
          bash scripts/capture-baseline.sh --output artifacts/ci-baseline
          sha256sum --check artifacts/ci-baseline/manifest.sha256

      - name: Reject unsafe evidence output paths
        run: bash scripts/test-evidence-output-safety.sh

      - name: Exercise fault scenarios
        run: bash scripts/test-fault-scenarios.sh

      - name: Exercise network diagnostics
        run: bash scripts/test-network-diagnostics.sh

      - name: Exercise reverse-proxy lab
        run: bash scripts/test-reverse-proxy-lab.sh

      - name: Install Ansible validation dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --disable-pip-version-check -r requirements-dev.txt
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install Ansible collections
        run: "$RUNNER_TEMP/ansible-venv/bin/ansible-galaxy collection install -r requirements.yml"

      - name: Lint Ansible content
        run: "$RUNNER_TEMP/ansible-venv/bin/ansible-lint"

      - name: Check playbook syntax
        run: |
          ANSIBLE_ROLES_PATH=roles "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            --syntax-check -i inventory/dev/hosts.yml playbooks/site.yml
          ANSIBLE_ROLES_PATH=roles "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            --syntax-check -i inventory/prod-like/hosts.yml playbooks/site.yml
          ANSIBLE_ROLES_PATH=roles "$RUNNER_TEMP/ansible-venv/bin/ansible-playbook" \
            --syntax-check -i inventory/dev/hosts.yml playbooks/verify.yml

      - name: Validate environment inventories
        run: |
          "$RUNNER_TEMP/ansible-venv/bin/ansible-inventory" -i inventory/dev/hosts.yml --list >/dev/null
          "$RUNNER_TEMP/ansible-venv/bin/ansible-inventory" -i inventory/prod-like/hosts.yml --list >/dev/null

      - name: Reject unsafe Ansible input
        run: bash scripts/test-invalid-ansible-input.sh
