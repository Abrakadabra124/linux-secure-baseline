---
- name: Restart SSH
  ansible.builtin.systemd_service:
    name: ssh
    state: restarted

- name: Reload sysctl
  ansible.builtin.command: /usr/sbin/sysctl --system
  changed_when: true

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
