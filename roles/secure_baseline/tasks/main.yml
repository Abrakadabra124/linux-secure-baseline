---
- name: Validate secure baseline inputs
  ansible.builtin.assert:
    that:
      - ansible_facts["system"] == "Linux"
      - ansible_facts["os_family"] == "Debian"
      - secure_baseline_ssh_max_auth_tries | int >= 1
      - secure_baseline_ssh_max_auth_tries | int <= 10
      - secure_baseline_ssh_permit_root_login in ["yes", "no", "prohibit-password", "forced-commands-only"]
      - secure_baseline_ssh_password_authentication in ["yes", "no"]
    fail_msg: The secure baseline supports Debian-family Linux nodes and validated SSH values only.

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ secure_baseline_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Remove legacy late-loading SSH hardening drop-in
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/70-secure-baseline.conf
    state: absent
  when: secure_baseline_manage_ssh | bool
  notify: Restart SSH

- name: Configure early-loading SSH hardening drop-in
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/05-secure-baseline.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  when: secure_baseline_manage_ssh | bool
  notify: Restart SSH

- name: Read effective SSH configuration before restart
  ansible.builtin.command: /usr/sbin/sshd -T
  changed_when: false
  register: secure_baseline_effective_ssh
  when: secure_baseline_manage_ssh | bool

- name: Assert effective SSH hardening before restart
  ansible.builtin.assert:
    that:
      - "'permitrootlogin ' ~ secure_baseline_ssh_permit_root_login in secure_baseline_effective_ssh.stdout"
      - "'passwordauthentication ' ~ secure_baseline_ssh_password_authentication in secure_baseline_effective_ssh.stdout"
      - "'maxauthtries ' ~ (secure_baseline_ssh_max_auth_tries | string) in secure_baseline_effective_ssh.stdout"
      - "'allowagentforwarding ' ~ secure_baseline_ssh_allow_agent_forwarding in secure_baseline_effective_ssh.stdout"
      - "'x11forwarding ' ~ secure_baseline_ssh_x11_forwarding in secure_baseline_effective_ssh.stdout"
    fail_msg: An earlier SSH directive prevents the managed hardening values from taking effect.
    quiet: true
  when: secure_baseline_manage_ssh | bool

- name: Configure kernel security settings
  ansible.builtin.template:
    src: sysctl.conf.j2
    dest: /etc/sysctl.d/70-secure-baseline.conf
    owner: root
    group: root
    mode: "0644"

- name: Enforce live kernel security settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_file: /etc/sysctl.d/70-secure-baseline.conf
    sysctl_set: true
    reload: false
  loop: "{{ secure_baseline_sysctl | dict2items }}"

- name: Configure process limits
  ansible.builtin.template:
    src: limits.conf.j2
    dest: /etc/security/limits.d/70-secure-baseline.conf
    owner: root
    group: root
    mode: "0644"

- name: Create persistent journal directory
  ansible.builtin.file:
    path: /var/log/journal
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"
  when: secure_baseline_manage_journald | bool
  notify: Restart journald

- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: secure_baseline_manage_journald | bool

- name: Configure persistent journald limits
  ansible.builtin.template:
    src: journald.conf.j2
    dest: /etc/systemd/journald.conf.d/70-secure-baseline.conf
    owner: root
    group: root
    mode: "0644"
  when: secure_baseline_manage_journald | bool
  notify: Restart journald

- name: Enable time synchronization
  ansible.builtin.systemd_service:
    name: "{{ secure_baseline_timesync_service }}"
    enabled: true
    state: started
  when: secure_baseline_manage_timesync | bool
